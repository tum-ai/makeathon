name: Vercel Production

# Production deploys run here rather than through Vercel's Git integration,
# which vercel.json turns off.
#
# workflow_run executes this file from the default branch only after CI passed;
# the checkout pins the deploy to the exact commit CI validated.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Queue deploys; a newer one must not cancel one that is building or promoting.
concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The project IDs are not secret; the token is passed only to the steps that call Vercel,
    # so the checkout, the dependency install and the CLI install never see it.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install Vercel CLI
        run: npm install --global vercel@62.2.0 --no-fund --no-audit

      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Runs `bun run build`, so the kit CSS sentinel (postbuild) guards production too.
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Check main is still current
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$EXPECTED_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: main moved from \`$EXPECTED_SHA\` to \`$current\`; the newer run deploys." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        if: steps.freshness.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          [[ "$url" =~ ^https:// ]] || { echo "::error::Vercel returned no deployment URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`$HEAD_SHA\` to $url" >> "$GITHUB_STEP_SUMMARY"
