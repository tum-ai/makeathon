version: 2
updates:
  # As of 2026-10, Dependabot reads bun.lock only up to lockfileVersion 1 and
  # Bun 1.4 writes 2, so this job fails until Dependabot catches up. Kept as
  # is: it starts working with no change here. Until then, `bun update`.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # The ui-kit is vendored (vendor/README.md); bump it by re-vendoring.
    ignore:
      - dependency-name: "@tum.ai/ui-kit"
    groups:
      next:
        patterns: ["next", "@next/*", "react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      development:
        dependency-type: development
      runtime:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
